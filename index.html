<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Nisanur Kandemir - Ödevler</title>
    <style>
        
        body {
            font-family: Arial, sans-serif; 
            background-color: white;
            color: black;
            margin: 20px;
        }
        h1, h2, h3 {
            text-align: center;
        }
        table {
            margin-left: auto;
            margin-right: auto;
            border-collapse: collapse; 
            width: 60%; 
        }
        th, td {
            border: 1px solid black; 
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #eee; 
            text-align: center;
        }
        td a {
            color: blue; 
            text-decoration: underline;
        }
    </style>
</head>
<body>

    
    <h1>Nisanur Kandemir</h1>
    <h3>Bilgisayar Programcılığı - Ödev Listesi</h3>
    <br>

    
    
    <table border="1">
        <thead>
            <tr>
                <th>Ödev Adı</th>
                <th style="text-align: center;">İşlem</th>
            </tr>
        </thead>
        <tbody id="odev-listesi">
            
        </tbody>
    </table>

    <br><br>
    <center>
        <small>&copy; 2025 Nisanur Kandemir</small>
    </center>

    
    <script>
        
        var tablo = document.getElementById("odev-listesi");
        var htmlKodu = "";

        
        for (var i = 1; i <= 129; i++) {
            var dosyaAdi = "dosyalar/odev" + i + ".html";
            
            
            htmlKodu += "<tr>";
            htmlKodu += "<td>Ödev " + i + "</td>";
            htmlKodu += "<td style='text-align: center;'>";
            
            htmlKodu += "<a href='" + dosyaAdi + "' target='_blank'>Önizleme</a>";
            htmlKodu += "</td>";
            htmlKodu += "</tr>";
        }

        
        tablo.innerHTML = htmlKodu;
    </script>

</body>
</html>
