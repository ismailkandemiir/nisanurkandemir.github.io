<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Nisanur Kandemir - Ödevler</title>
    <style>
        /* Sadece yazıları merkeze almak ve biraz okunur kılmak için çok temel stiller */
        body {
            font-family: Arial, sans-serif; /* Standart yazı tipi */
            background-color: white;
            color: black;
            margin: 20px;
        }
        h1, h2, h3 {
            text-align: center;
        }
        table {
            margin-left: auto;
            margin-right: auto;
            border-collapse: collapse; /* Çizgileri tek çizgi yapar */
            width: 60%; /* Tablo genişliği */
        }
        th, td {
            border: 1px solid black; /* Siyah kenarlık */
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #eee; /* Başlıklar hafif gri olsun */
            text-align: center;
        }
        td a {
            color: blue; /* Linkler standart mavi */
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- BAŞLIK -->
    <h1>Nisanur Kandemir</h1>
    <h3>Bilgisayar Programcılığı - Ödev Listesi</h3>
    <br>

    <!-- ÖDEV TABLOSU -->
    <!-- border="1" en temel HTML tablo özelliğidir -->
    <table border="1">
        <thead>
            <tr>
                <th>Ödev Adı</th>
                <th style="text-align: center;">İşlem</th>
            </tr>
        </thead>
        <tbody id="odev-listesi">
            <!-- JavaScript burayı dolduracak -->
        </tbody>
    </table>

    <br><br>
    <center>
        <small>&copy; 2025 Nisanur Kandemir</small>
    </center>

    <!-- BASİT JAVASCRIPT KODU -->
    <script>
        // Tabloyu buluyoruz
        var tablo = document.getElementById("odev-listesi");
        var htmlKodu = "";

        // 1'den 129'a kadar döngü
        for (var i = 1; i <= 129; i++) {
            var dosyaAdi = "dosyalar/odev" + i + ".html";
            
            // Basit HTML satırları oluşturuyoruz
            htmlKodu += "<tr>";
            htmlKodu += "<td>Ödev " + i + "</td>";
            htmlKodu += "<td style='text-align: center;'>";
            // Sadece Önizleme Linki
            htmlKodu += "<a href='" + dosyaAdi + "' target='_blank'>Önizleme</a>";
            htmlKodu += "</td>";
            htmlKodu += "</tr>";
        }

        // Tabloya yazdırıyoruz
        tablo.innerHTML = htmlKodu;
    </script>

</body>
</html>
